<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civilian Portal - SafeGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background-color: #ffffff; color: #333; line-height: 1.6; }

    /* Navbar */
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
    .logo { font-size: 22px; font-weight: bold; color: #333; }
    .nav-links a { text-decoration: none; color: #333; margin: 0 15px; font-weight: 500; }
    .nav-links a:hover { color: #e53935; }

    /* Hero Section */
    .hero {
      background: url('https://images.unsplash.com/photo-1508921912186-1d1a45ebb3c1') no-repeat center center/cover;
      text-align: center;
      padding: 100px 20px;
      color: #fff;
    }
    .hero h1 { font-size: 42px; font-weight: bold; margin-bottom: 10px; }

    /* Form Section */
    .container { max-width: 600px; margin: 50px auto; text-align: center; padding: 20px; }
    .form-box { background: #f9f9f9; border-radius: 10px; padding: 40px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .form-box h2 { font-size: 28px; color: #e53935; margin-bottom: 20px; }
    .form-box input { width: 80%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; margin-bottom: 20px; }
    .form-box input:focus { border-color: #e53935; outline: none; }
    .form-box button { padding: 12px 24px; background: #e53935; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .form-box button:hover { background: #c62828; }

    /* Footer */
    footer { background: #fafafa; padding: 30px 20px; text-align: center; border-top: 1px solid #eee; color: #666; margin-top: 50px; }
    footer a { text-decoration: none; color: #666; margin: 0 10px; }
    footer a:hover { color: #e53935; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="logo">SafeGuard</div>
    <div class="nav-links">
             <a href="{{ url_for('index') }}">Home</a>
             <a href="{{ url_for('learnmore') }}">Learn More</a>
       <a href="{{ url_for('contact') }}">Contact</a>
    </div>
  </nav>

  <!-- Hero -->
  <div class="hero">
    <h1>Civilian Portal</h1>
    <p>Check if an agency or online store has any suspicious records.</p>
  </div>

  <!-- Form Section -->
  <div class="container">
    <div class="form-box">
      <h2>Enter Agency/Store Name</h2>
      <p style="color: #666; margin-bottom: 20px; font-size: 14px;">
        Try these examples: fakebank.com, scamstore.net, phishingagency.org
      </p>
             <form action="{{ url_for('civilian') }}" method="POST">
        <input type="text" name="agency" placeholder="Enter agency or store name" required>
        <br>
        <button type="submit">Check Agency</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div>
             <a href="{{ url_for('privacy') }}">Privacy Policy</a> | 
       <a href="{{ url_for('terms') }}">Terms of Service</a> | 
       <a href="{{ url_for('support') }}">Support</a>
    </div>
    <p>© 2024 SafeGuard. All rights reserved.</p>
  </footer>
</body>
</html>
